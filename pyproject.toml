[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litecode"
version = "0.1.0"
description = "Run open-weight LLMs on any machine, from a 4GB laptop to a GPU workstation. Auto-detects hardware, picks models that fit, works fully offline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Konko Maji" }]
keywords = ["local-llm", "llama-cpp", "coding-agent", "offline-ai", "cpu-inference",
            "open-weight", "low-end-pc", "ai-pair-programmer", "security-analysis", "terminal"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []   # stdlib only; the engine (llama.cpp) is downloaded by `litecode setup`

[project.urls]
Homepage = "https://github.com/konkomaji/litecode"
Repository = "https://github.com/konkomaji/litecode"

[project.scripts]
litecode = "litecode.cli:main"
lite = "litecode.cli:main"

[tool.setuptools]
packages = ["litecode"]
